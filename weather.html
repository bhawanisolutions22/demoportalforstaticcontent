<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Weather — AmbkNews</title>

    <link rel="stylesheet" href="/css/style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JYZCB2XSSN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-JYZCB2XSSN');
    </script>

    <!-- Basic setup -->
    <meta name="description" content="Live weather updates and a 3‑day forecast for your location. Shows current temperature, wind speed and conditions using Open‑Meteo.">
    <link rel="canonical" href="https://ambknews.com/weather.html">

    <!-- SEO -->
    <meta name="author" content="AmbkNews">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="AmbkNews — Live Weather & 3‑Day Forecast">
    <meta property="og:description" content="Live weather updates and a 3‑day forecast. Detects your location and shows temperature, wind speed and conditions powered by Open‑Meteo.">
    <meta property="og:url" content="https://ambknews.com/weather.html">
    <meta property="og:image" content="https://ambknews.com/images/logo.png">
    <meta property="og:site_name" content="AmbkNews">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AmbkNews — Live Weather & 3‑Day Forecast">
    <meta name="twitter:description" content="Live weather updates and a 3‑day forecast. Detects your location and shows temperature, wind speed and conditions powered by Open‑Meteo.">
    <meta name="twitter:image" content="https://ambknews.com/images/logo.png">

    <!-- Structured Data (JSON-LD Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "url": "https://ambknews.com/weather.html",
      "name": "AmbkNews Weather",
      "description": "Live weather updates and a 3‑day forecast. Detects your location and shows temperature, wind speed and conditions powered by Open‑Meteo.",
      "publisher": {
        "@type": "Organization",
        "name": "AmbkNews",
        "logo": {
          "@type": "ImageObject",
          "url": "https://ambknews.com/images/logo.png"
        }
      }
    }
    </script>

    <!-- Optional -->
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/favicon.png" type="image/x-icon">

    <style>
        /* Page-specific weather styles (mobile-first, then scale up) */
        :root{--card-bg:#ffffff;--muted:#6b7280;--accent:#0b66ff}
        html,body{height:100%}
        body{
            background:linear-gradient(180deg,#f5f7fb,#eef3ff);
            margin:0;
            font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        main.container{
            width:100%;
            max-width:900px;
            margin:20px auto;
            padding:12px;
            box-sizing:border-box;
        }

        .weather-wrap{display:flex;flex-direction:column;gap:14px}

        .card{
            background:var(--card-bg);
            border-radius:12px;
            padding:14px;
            box-shadow:0 8px 24px rgba(16,24,40,0.06);
            overflow:hidden;
        }

        .headline{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            flex-wrap:wrap;
        }

        h1{margin:0;font-size:1.1rem}

        .meta{
            color:var(--muted);
            font-size:0.92rem;
            white-space:nowrap;
        }

        .current{
            display:grid;
            grid-template-columns:64px 1fr;
            gap:12px;
            align-items:center;
            margin-top:12px;
        }

        .icon-lg{
            width:64px;
            height:64px;
            border-radius:10px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(180deg,rgba(11,102,255,0.06),rgba(11,102,255,0.02));
            font-size:30px;
            line-height:1;
        }

        .temp{
            font-size:1.6rem;
            font-weight:700;
            margin:0;
        }

        .conds{color:var(--muted);margin-top:6px;font-size:0.98rem}

        .wind{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:0.95rem}

        .controls{
            display:flex;
            gap:8px;
            align-items:center;
            margin-top:10px;
            flex-wrap:wrap;
        }

        button.refresh{
            background:var(--accent);
            color:#fff;
            border:0;
            padding:8px 12px;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        .loading{color:var(--muted);font-size:0.95rem}

        .forecast{
            display:grid;
            grid-template-columns:repeat(1,1fr);
            gap:10px;
            margin-top:12px;
        }

        .day{
            background:linear-gradient(180deg,#fff,#fbfdff);
            padding:10px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 4px 12px rgba(16,24,40,0.04);
        }

        .day .date{font-weight:600;margin-bottom:6px;font-size:0.95rem}
        .day .mini-icon{font-size:20px}
        .day .temps{margin-top:8px;font-weight:600}

        .error{
            color:#9b1c1c;
            background:#fff6f6;
            padding:12px;
            border-radius:8px;
            border:1px solid rgba(155,28,28,0.06);
            margin-top:8px;
        }

        /* Larger layouts */
        @media (min-width:520px){
            .forecast{grid-template-columns:repeat(2,1fr);}
            .current{grid-template-columns:84px 1fr}
            .icon-lg{width:72px;height:72px;font-size:34px;border-radius:12px}
            .temp{font-size:1.9rem}
            main.container{padding:16px;margin:28px auto;}
        }

        @media (min-width:900px){
            .forecast{grid-template-columns:repeat(3,1fr);}
            .icon-lg{width:84px;height:84px;font-size:40px}
            .temp{font-size:2.1rem}
            main.container{padding:18px;margin:36px auto;}
        }

        /* Small-screen touch-friendly controls */
        @media (max-width:420px){
            .headline{align-items:flex-start}
            .meta{width:100%;text-align:left;margin-top:6px;font-size:0.9rem}
            .current{grid-template-columns:1fr;grid-row-gap:8px}
            .icon-lg{margin:0 auto}
            .current > div{display:flex;flex-direction:column;align-items:center;text-align:center}
            .wind{justify-content:center}
            .controls{flex-direction:column;align-items:stretch}
            button.refresh{width:100%}
            .card{padding:12px}
            .day{padding:12px}
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main class="container">
        <div class="weather-wrap">
            <section class="card" aria-labelledby="current-heading">
                <div class="headline">
                    <h1 id="current-heading">Current Weather</h1>
                    <div class="meta" id="location">Detecting location…</div>
                </div>

                <div id="current" class="current" role="region" aria-live="polite">
                    <div class="icon-lg" id="current-icon" title="weather icon">☀️</div>
                    <div>
                        <p class="temp" id="current-temp">—</p>
                        <div class="conds" id="current-conds">Loading…</div>
                        <div class="wind" id="current-wind"></div>
                        <div class="controls">
                            <div class="loading" id="status"></div>
                            <button class="refresh" id="refresh">Refresh</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card" aria-labelledby="forecast-heading">
                <h2 id="forecast-heading">3‑Day Forecast</h2>
                <div id="forecast" class="forecast" role="list">
                    <!-- days rendered here -->
                </div>
            </section>

            <div id="error" class="error" style="display:none">Weather data unavailable</div>
        </div>
    </main>

    <div id="footer"></div>

    <script>
        // Simple mapping of Open-Meteo weathercode to emoji/text
        const weatherMap = {
            0: ['Clear', '☀️'],
            1: ['Mainly clear', '🌤️'],
            2: ['Partly cloudy', '⛅'],
            3: ['Overcast', '☁️'],
            45: ['Fog', '🌫️'],
            48: ['Depositing rime fog', '🌫️'],
            51: ['Light drizzle', '🌦️'],
            53: ['Moderate drizzle', '🌦️'],
            55: ['Dense drizzle', '🌧️'],
            61: ['Slight rain', '🌧️'],
            63: ['Moderate rain', '🌧️'],
            65: ['Heavy rain', '⛈️'],
            71: ['Slight snow', '🌨️'],
            73: ['Moderate snow', '🌨️'],
            75: ['Heavy snow', '❄️'],
            80: ['Rain showers', '🌧️'],
            81: ['Heavy showers', '🌧️'],
            95: ['Thunderstorm', '⛈️']
        };

        const els = {
            location: document.getElementById('location'),
            currentTemp: document.getElementById('current-temp'),
            currentConds: document.getElementById('current-conds'),
            currentIcon: document.getElementById('current-icon'),
            currentWind: document.getElementById('current-wind'),
            forecast: document.getElementById('forecast'),
            status: document.getElementById('status'),
            errorBox: document.getElementById('error'),
            refresh: document.getElementById('refresh')
        };

        const DEFAULT = {name: 'Ahmedabad, IN', lat: 23.0225, lon: 72.5714};

        async function fetchWeather(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&windspeed_unit=kmh`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('API request failed');
            return res.json();
        }

        function mapWeather(code){ return weatherMap[code] || ['Unknown','❔']; }

        function fmtDate(iso){
            const d = new Date(iso);
            return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
        }

        async function update(lat, lon, placeName){
            els.status.textContent = 'Updating…';
            els.errorBox.style.display = 'none';
            try{
                const data = await fetchWeather(lat, lon);
                const cw = data.current_weather;
                const [condText, condIcon] = mapWeather(cw.weathercode);
                els.currentIcon.textContent = condIcon;
                els.currentTemp.textContent = `${Math.round(cw.temperature)}°C`;
                els.currentConds.textContent = condText;
                els.currentWind.innerHTML = `<span title="Wind speed">💨 ${Math.round(cw.windspeed)} km/h</span>`;
                els.location.textContent = placeName || (data.timezone || '');

                const daily = data.daily;
                els.forecast.innerHTML = '';
                for(let i=0;i<3 && i<daily.time.length;i++){
                    const date = daily.time[i];
                    const tmin = Math.round(daily.temperature_2m_min[i]);
                    const tmax = Math.round(daily.temperature_2m_max[i]);
                    const wcode = daily.weathercode ? daily.weathercode[i] : null;
                    const [tText, tIcon] = mapWeather(wcode);
                    const node = document.createElement('div');
                    node.className = 'day';
                    node.setAttribute('role','listitem');
                    node.innerHTML = `<div class="date">${fmtDate(date)}</div>
                                      <div class="mini-icon">${tIcon}</div>
                                      <div style="margin-top:6px">${tText}</div>
                                      <div class="temps">${tmin}° / ${tmax}°</div>`;
                    els.forecast.appendChild(node);
                }
                els.status.textContent = '';
            }catch(err){
                console.error(err);
                els.errorBox.style.display = 'block';
                els.status.textContent = '';
                els.currentTemp.textContent = '—';
                els.currentConds.textContent = 'Weather data unavailable';
                els.currentIcon.textContent = '❔';
                els.forecast.innerHTML = '';
            }
        }

        function tryGeolocation(){
            els.status.textContent = 'Detecting location…';
            return new Promise((resolve)=>{
                if (!navigator.geolocation){ resolve(null); return; }
                const opts = {enableHighAccuracy:false,timeout:7000,maximumAge:600000};
                navigator.geolocation.getCurrentPosition(pos=>{
                    resolve({lat:pos.coords.latitude, lon:pos.coords.longitude});
                }, ()=>{ resolve(null); }, opts);
            });
        }

        async function init(){
            let geo = await tryGeolocation();
            if (!geo){
                els.location.textContent = `${DEFAULT.name} (default)`;
                await update(DEFAULT.lat, DEFAULT.lon, DEFAULT.name);
            }else{
                els.location.textContent = 'Current location';
                await update(geo.lat, geo.lon, 'Your location');
            }
        }

        els.refresh.addEventListener('click', ()=>{ init(); });

        async function loadLayout(id, url){
            try{ const r = await fetch(url); if(r.ok) document.getElementById(id).innerHTML = await r.text(); }catch(e){}
        }
        loadLayout('header','/header.html');
        loadLayout('footer','/footer.html');

        window.addEventListener('load', init);
    </script>
</body>
</html>
